        }

        body {
            font-family: Arial, Helvetica, sans-serif;

        }

        /* =========================
           NAVBAR
        ========================== */

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 76px;
            background: rgba(4, 18, 35, 0.96);
            border-bottom: 1px solid rgba(80, 170, 255, 0.20);
            z-index: 1000;
            backdrop-filter: blur(12px);
        }

        .navbar {
            width: 100%;
            max-width: 1200px;
            height: 76px;
            margin: auto;
            padding: 0 24px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* LOGO */

        .logo {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .logo img {
            display: block;
            width: 58px;
            height: 58px;
            object-fit: contain;
        }

        /* NAVIGATION */

        .nav-links {
            display: flex;
            align-items: center;
            gap: 34px;
        }

        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: 0.3s ease;
        }

        .nav-links a:hover {
            color: #58b8ff;
        }

        /* =========================
           HOME
        ========================== */

        #home {
            min-height: 100vh;
            padding-top: 76px;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;
            overflow: hidden;

            background:
                radial-gradient(
                    circle at center,
                    rgba(22, 91, 150, 0.30),
                    transparent 48%
                ),
                linear-gradient(
                    180deg,
                    #071a33 0%,
                    #061426 100%
                );
        }

        #home::before {
            content: "";
            position: absolute;
            width: 520px;
            height: 520px;
            border-radius: 50%;
            background: rgba(30, 125, 210, 0.10);
            filter: blur(80px);
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .home-content {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 40px 20px;
            max-width: 900px;
        }

        .home-logo {
            width: 150px;
            height: 150px;
            object-fit: contain;
            margin-bottom: 30px;

            filter:
                drop-shadow(0 0 18px rgba(75, 175, 255, 0.20));
        }

        .coming-soon {
            font-size: clamp(42px, 8vw, 82px);
            line-height: 1.05;
            font-weight: 700;
            letter-spacing: 3px;
            color: #ffffff;
            margin-bottom: 20px;
        }

        .subtitle {
            color: #8fcfff;
            font-size: clamp(15px, 2vw, 20px);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* =========================
           CONTACT
        ========================== */

        #contact {
            min-height: 280px;
            background: #04101f;
            border-top: 1px solid rgba(80, 170, 255, 0.18);

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;
            padding: 70px 20px;
        }

        .contact-content {
            max-width: 700px;
        }

        .contact-title {
            font-size: 32px;
            margin-bottom: 18px;
            color: #ffffff;
        }

        .contact-text {
            color: #9bb6cc;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .email {
            display: inline-block;
            color: #58b8ff;
            font-size: 17px;
            font-weight: 600;
            text-decoration: none;
            padding: 12px 20px;

            border: 1px solid rgba(88, 184, 255, 0.35);
            border-radius: 6px;

            transition: 0.3s ease;
        }

        .email:hover {
            color: #ffffff;
            background: rgba(88, 184, 255, 0.10);
            border-color: #58b8ff;
        }

        /* =========================
           FOOTER
        ========================== */

        footer {
            background: #020a14;
            border-top: 1px solid rgba(80, 170, 255, 0.10);

            text-align: center;
            padding: 22px 15px;

            color: #647f96;
            font-size: 13px;
        }

        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 600px) {

            header {
                height: 68px;
            }

            .navbar {
                height: 68px;
                padding: 0 18px;
            }

            .logo img {
                width: 50px;
                height: 50px;
            }

            .nav-links {
                gap: 18px;
            }

            .nav-links a {
                font-size: 14px;
            }

            #home {
                padding-top: 68px;
            }

            .home-logo {
                width: 125px;
                height: 125px;
                margin-bottom: 25px;
            }

            .coming-soon {
                letter-spacing: 1px;
            }

            .subtitle {
                font-size: 13px;
                letter-spacing: 1.5px;
            }

            .contact-title {
                font-size: 28px;
            }

            .email {
                font-size: 15px;
                word-break: break-word;
            }
        }
    </style>
</head>
